<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<title>Sri Rudram practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
<style>:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#2B2118; --muted:#6F6253; --line:#E7DED1;
  --accent:#B4531A; --accent-ink:#FFFFFF; --accent-soft:#F6E5D8;
  --ok:#2E7D4F; --ok-soft:#E3F1E8; --bad:#C0392B; --bad-soft:#F8E1DE; --warn:#B7791F; --warn-soft:#FBEFD9;
  --rec:#C62828; --lane:#F3ECE2; --shadow:0 1px 3px rgba(43,33,24,.08),0 4px 14px rgba(43,33,24,.06);
  --deva:"Tiro Devanagari Sanskrit","Noto Sans Devanagari","Kohinoor Devanagari",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1611; --card:#251E17; --ink:#F2EAE0; --muted:#B5A898; --line:#3A3027;
    --accent:#E0803F; --accent-ink:#1B1611; --accent-soft:#3A2618;
    --ok:#5BBE83; --ok-soft:#1E3227; --bad:#EF6C5E; --bad-soft:#3C1F1B; --warn:#E3A84A; --warn-soft:#3A2D16;
    --rec:#EF5350; --lane:#2E261E; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1611; --card:#251E17; --ink:#F2EAE0; --muted:#B5A898; --line:#3A3027;
  --accent:#E0803F; --accent-ink:#1B1611; --accent-soft:#3A2618;
  --ok:#5BBE83; --ok-soft:#1E3227; --bad:#EF6C5E; --bad-soft:#3C1F1B; --warn:#E3A84A; --warn-soft:#3A2D16;
  --rec:#EF5350; --lane:#2E261E; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 96px}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:18px;margin:18px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button,.btn{font:600 16px var(--ui);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.big{width:100%;font-size:18px;min-height:56px}
.chip{min-height:38px;padding:6px 12px;border-radius:20px;font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.link{background:none;border:none;color:var(--accent);padding:6px 0;min-height:0;font-weight:600}
.deva{font-family:var(--deva);font-size:27px;line-height:1.9;word-break:normal;overflow-wrap:anywhere}
.deva.sm{font-size:21px;line-height:1.8}
.iast{font-style:italic;color:var(--muted);font-size:15px}
.label{display:inline-block;font:600 13px var(--ui);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player > div,.player iframe{position:absolute;inset:0;width:100%;height:100%}
.bar{height:8px;background:var(--lane);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:4px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.good{background:var(--ok-soft);border-radius:10px;padding:10px 12px}
.badbox{background:var(--bad-soft);border-radius:10px;padding:10px 12px}
.meter{height:10px;background:var(--lane);border-radius:5px;overflow:hidden}
.meter > i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.p{background:var(--ok)} .dots i.f{background:var(--bad)}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:none}
.tick{color:var(--ok);font-weight:700}
.stafwrap{overflow-x:auto}
svg text{font-family:var(--deva)}
textarea{width:100%;min-height:120px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
input[type=number],select{font:16px var(--ui);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sticky{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 0 12px}
.hidden{display:none !important}
.steps{display:flex;gap:6px;margin:8px 0}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--ok)} .steps span.cur{background:var(--accent)}
@media (max-width:420px){ .deva{font-size:24px} }

.navbar{margin:12px 0}
.navbar:empty{display:none}
summary{list-style:none} summary::-webkit-details-marker{display:none}
.chev{display:inline-block;transition:transform .15s;color:var(--accent);font-weight:700;width:1em}
details[open] > summary .chev{transform:rotate(90deg)}

","i":"ta","w":2,"lv":"mid","wt":1},{"d":"ये॒","i":"ye","w":2,"lv":"low","wt":2},{"d":"न","i":"na","w":3,"lv":"mid","wt":1},{"d":"मः","i":"maḥ","w":3,"lv":"mid","wt":1}],"words":["oṃ","śrī","mahāgaṇapataye","namaḥ"]}],"keywords":"**gaṇānāṃ … gaṇapatiṁ** — lord of the hosts; **havāmahe** — we invoke; **kaviṃ kavīnām** — seer among seers; **jyeṣṭharājam** — eldest king; **sīda sādanam** — sit in your seat","meaning":"We call on you, Ganapati, lord of the hosts — seer among seers, of the highest renown, eldest king of sacred prayers, O Lord of prayer (Brahmanaspati). Hear us, and come with your protection to sit in your seat. (Then: salutation to the great Lord Ganapati.) In the Ṛgveda this verse is addressed to Brahmaṇaspati; tradition applies it to Gaṇapati.","notes":[]}]}]},{"title":"Part 2 — Namakam (Śrī Rudra Praśna)","sections":[{"title":"Opening","summary":"","groups":[{"id":"g2","title":"Lines O1","lines":[{"label":"O1","deva":"ॐ नमो भगवते॑ रुद्रा॒य","iast":"oṃ namo bhagavate rudrāya","syl":[{"d":"ॐ","i":"oṃ","w":0,"lv":"mid","wt":2},{"d":"न","i":"na","w":1,"lv":"mid","wt":1},{"d":"मो","i":"mo","w":1,"lv":"mid","wt":2},{"d":"भ","i":"bha","w":2,"lv":"mid","wt":1},{"d":"ग","i":"ga","w":2,"lv":"mid","wt":1},{"d":"व","i":"va","w":2,"lv":"mid","wt":1},{"d":"ते॑","i":"te","w":2,"lv":"high","wt":2},{"d":"रु","i":"ru","w":3,"lv":"mid","wt":1},{"d":"द्रा॒","i":"drā","w":3,"lv":"low","wt":2},{"d":"य","i":"ya","w":3,"lv":"mid","wt":1}],"words":["oṃ","namo","bhagavate","rudrāya"]}],"keywords":"","meaning":"Om. Salutation to the Lord Rudra.","notes":[]}]},{"title":"Namakam, anuvāka 1","summary":"Rudra's anger, arrow and bow are saluted and asked to become gracious; the mighty one is asked to lay down his weapons and protect.","groups":[{"id":"g3","title":"Lines 1.1–1.2","lines":[{"label":"1.1","deva":"ॐ नम॑स्ते रुद्र म॒न्यव॑ उ॒तोत॒ इष॑वे॒ नमः॑","iast":"oṃ namaste rudra manyava utota iṣave namaḥ","syl":[{"d":"ॐ","i":"oṃ","w":0,"lv":"mid","wt":2},{"d":"न","i":"na","w":1,"lv":           setTimeout(tick, 40);
        };
        setTimeout(tick, 150);
      });
    }
  }

  // ---------------- microphone recorder ----------------
  const WORKLET = `class Cap extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0}process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n===2048){this.port.postMessage(this.b.slice(0));this.n=0}}}return true}}registerProcessor('cap',Cap);`;
  class Recorder {
    constructor() { this.ctx = null; this.mode = null; }
    async start(onFrame) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This browser cannot use the microphone here. Open the page in Safari (iPhone) or Chrome (Mac).');
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.ctx) this.ctx = new AC();
      await this.ctx.resume();
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
      this.src = this.ctx.createMediaStreamSource(this.stream);
      this.rs = E.makeResampler(this.ctx.sampleRate);
      this.pt = new E.PitchTracker();
      this.peak = 0;
      const handle = chunk => {
        let m = 0; for (let i = 0; i < chunk.length; i++) { const v = Math.abs(chunk[i]); if (v > m) m = v; }
        this.peak = Math.max(m, this.peak * 0.9);
        const before = this.pt.frames.length;
        this.pt.push(this.rs(chunk));
        if (onFrame) for (let i = before; i < this.pt.frames.length; i++) onFrame(this.pt.frames[i], i, this.peak);
      };
      this.sink = this.ctx.createGain(); this.sink.gain.value = 0; this.sink.connect(this.ctx.destination);
      let ok = false;
      if (this.ctx.audioWorklet && window.AudioWorkletNode) {
        try {
          if (!this._wk) { const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })); await this.ctx.audioWorklet.addModule(url); this._wk = true; }
          this.node = new AudioWorkletNode(this.ctx, 'cap'); this.node.port.onmessage = ev => handle(ev.data);
          this.src.connect(this.node); this.node.connect(this.sink); ok = true; this.mode = 'worklet';
        } catch (e) { ok = false; }
      }
      if (!ok) {
        this.node = this.ctx.createScriptProcessor(2048, 1, 1);
        this.node.onaudioprocess = ev => handle(new Float32Array(ev.inputBuffer.getChannelData(0)));
        this.src.connect(this.node); this.node.connect(this.sink); this.mode = 'script';
      }
      this.t0 = performance.now();
      return this.mode;
    }
    async stop() {
      try { this.src && this.src.disconnect(); this.node && this.node.disconnect(); } catch (e) {}
      if (this.stream) this.stream.getTracks().forEach(t => t.stop()); // release the mic before any playback (iOS)
      this.stream = null;
      try { await this.ctx.suspend(); } catch (e) {}
      return this.pt ? this.pt.frames : [];
    }
    get sampleRate() { return this.ctx ? this.ctx.sampleRate : 0; }
  }

  // ---------------- svara staff (SVG) ----------------
  // lanes: high (top), middle, low. Each syllable: expected lane box; her dot (by semitone offset from her middle).
  function staff(line, res, opts) {
    opts = opts || {};
    const per = res ? res.per : null;
    const n = line.syl.length, perRow = opts.perRow || 10, rows = Math.ceil(n / perRow);
    const cw = 34, rowH = 120, padL = 30, W = padL + perRow * cw + 6, H = rows * rowH;
    const lanes = { high: 22, held: 22, mid: 52, low: 82 };
    const css = getComputedStyle(document.documentElement);
    const c = k => css.getPropertyValue(k).trim();
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.25}px" role="img" aria-label="Pitch of each syllable">`;
    for (let r = 0; r < rows; r++) {
      const y0 = r * rowH;
      [['high', '॑'], ['mid', '–'], ['low', '॒']].forEach(([k, m]) => {
        s += `<rect x="${padL - 4}" y="${y0 + lanes[k] - 11}" width="${W - padL}" height="22" rx="6" fill="${c('--lane')}"/>`;
      });
      s += `<text x="4" y="${y0 + 27}" font-size="11" fill="${c('--muted')}" font-family="var(--ui)">high</text>`;
      s += `<text x="4" y="${y0 + 57}" font-size="11" fill="${c('--muted')}" font-family="var(--ui)">mid</text>`;
      s += `<text x="4" y="${y0 + 87}" font-size="11" fill="${c('--muted')}" font-family="var(--ui)">low</text>`;
    }
    line.syl.forEach((sy, k) => {
      const r = Math.floor(k / perRow), col = k % perRow, y0 = r * rowH, x = padL + col * cw + cw / 2 - 4;
      const ly = y0 + lanes[sy.lv];
      s += `<rect x="${x - 12}" y="${ly - 9}" width="24" height="18" rx="5" fill="none" stroke="${c('--muted')}" stroke-width="1.4" stroke-dasharray="${sy.lv === 'mid' ? '2 2' : '0'}"/>`;
      if (sy.lv === 'held') s += `<rect x="${x - 14}" y="${ly - 11}" width="28" height="22" rx="6" fill="none" stroke="${c('--muted')}" stroke-width="1"/>`;
      const txt = sy.d.replace(/[॒॑᳚]/g, '');
      s += `<text x="${x}" y="${y0 + 112}" text-anchor="middle" font-size="15" fill="${c('--ink')}">${txt === 'ꣳ' ? 'ꣳ' : esc(txt)}</text>`;
      if (per && per[k]) {
        const p = per[k];
        if (p.obs === null || isNaN(p.d)) s += `<circle cx="${x}" cy="${y0 + 52}" r="4" fill="${c('--line')}"/>`;
        else {
          const dy = Math.max(-2.6, Math.min(2.6, p.d)) * (30 / 1.6);
          const col2 = p.ok ? c('--ok') : c('--bad');
          s += `<circle cx="${x}" cy="${y0 + 52 - dy}" r="6.5" fill="${col2}"/>`;
        }
      }
    });
    return s + '</svg>';
  }
  function esc(t) { return String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

  window.Shared = { Course, Timings, LinePlayer, Recorder, staff, esc, VIDEOS };
})();

</script><script>
/* Chant Trainer — the learner's app. */
(function () {
  'use strict';
  const E = window.ChantEngine, S = window.Shared, { Course, Timings, esc } = S;
  const C = Course.flat();
  const KEY = 'anuRudram.v1';
  const $ = sel => document.querySelector(sel);
  const app = $('#app'), head = $('#head'), pbox = $('#playerbox');

  // ---------------- state ----------------
  const fresh = () => ({ v: 1, lines: {}, groups: {}, sections: {}, parts: {}, reviewAt: 0, done: [], settings: { target: 75, listens: 2, speed: 0.75, teacher: false }, sittingDay: '', warmupDue: false, lastExport: 0, created: Date.now() });
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null') || fresh(); } catch (e) { st = fresh(); }
  st.settings = Object.assign(fresh().settings, st.settings || {});
  let storageOK = true;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { storageOK = false; } }
  const L = label => (st.lines[label] = st.lines[label] || { a: [], passed: false, flag: false, ear: false });
  const G = id => (st.groups[id] = st.groups[id] || { whole: false, meaning: false, done: false });
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const target = () => st.settings.target;
  const linePassed = l => { const s = L(l.label); return s.passed || s.ear; };
  const isEar = label => !!(st.lines[label] && st.lines[label].ear);
  const groupDone = g => G(g.id).done;
  const sectionDone = s => s.groups.every(groupDone) && (s.groups.length < 2 || (st.sections[s.id] || {}).test);
  Timings.load();

  // ---------------- next step ----------------
  function nextStep() {
    if (st.warmupDue && st.done.length) return { kind: 'warmup' };
    if (st.done.length - st.reviewAt >= 5) return { kind: 'review', groups: st.done.slice(st.reviewAt, st.reviewAt + 5) };
    for (const s of C.sections) {
      const allG = s.groups.every(groupDone);
      if (allG && s.groups.length >= 2 && !(st.sections[s.id] || {}).test) return { kind: 'test', section: s.id };
      const g = s.groups.find(x => !groupDone(x));
      if (g) return { kind: 'learn', group: g.id };
    }
    for (const pi of [1, 2]) if (!(st.parts[pi] || {}).final) return { kind: 'final', part: pi };
    if (!(st.parts.all || {}).final) return { kind: 'final', part: 'all' };
    return { kind: 'free' };
  }
  function stepTitle(n) {
    if (n.kind === 'warmup') return 'Warm-up: chant what you learned last time';
    if (n.kind === 'review') return 'Review: chant your last 5 mantras together';
    if (n.kind === 'test') return 'Test: chant the whole of ' + C.sectionById[n.section].title;
    if (n.kind === 'learn') { const g = C.groupById[n.group]; return 'Learn ' + g.title + ' — ' + C.sectionById[g.section].title; }
    if (n.kind === 'final') return n.part === 'all' ? 'Final: the whole Sri Rudram' : 'Final: the whole ' + (n.part === 1 ? 'Namakam' : 'Chamakam');
    return 'You have learned the whole Sri Rudram. Practise any part you like.';
  }

  // ---------------- player (one for the whole app, kept across views) ----------------
  const player = new S.LinePlayer('yt', (k, v) => {
    if (k === 'error') ytMsg('<span class="bad">The video could not play here (YouTube error ' + v + ').</span> <a href="https://www.youtube.com/watch?v=' + (player.video || S.VIDEOS.namakam) + '" target="_blank" rel="noopener">Open it on YouTube</a>');
  });
  function ytMsg(h) { $('#ytmsg').innerHTML = h || 'Reference: the late K. Suresh (Ghanapāṭhī), from his YouTube channel “The Ghanapati”.'; }
  function showPlayer(on) {
    pbox.classList.toggle('hidden', !on);
    if (on) { ytMsg(); player.ensure('namakam').catch(e => ytMsg('<span class="bad">' + esc(e.message) + '</span>')); }
  }
  let recording = false;
  const rec = new S.Recorder(); let wake = null; let takeToken = 0;
  function cancelRecording() { // called whenever the view changes
    takeToken++;
    if (recording) { recording = false; rec.stop(); try { wake && wake.release(); } catch (e) {} }
  }
  function leave() { cancelRecording(); player.stop(); window.scrollTo(0, 0); }

  function speedChips() {
    return '<div class="row" role="group" aria-label="Speed">' + [1, 0.75, 0.5].map(r => `<button class="chip ${st.settings.speed === r ? 'on' : ''}" data-speed="${r}">${r === 1 ? 'Normal' : r + '×'}</button>`).join('') + '</div>';
  }
  function bindSpeed() { app.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { st.settings.speed = +b.dataset.speed; save(); app.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', +x.dataset.speed === st.settings.speed)); }); }
  async function listen(labels, times, btn) {
    const runs = Timings.runs(labels);
    if (!runs || recording) return;
    btn.disabled = true; btn.textContent = '♪ Playing…';
    try {
      outer: for (let i = 0; i < times; i++) {
        for (const r of runs) {
          const res = await player.play(r.v, r.s, r.e, st.settings.speed);
          if (res === 'blocked') { ytMsg('<b>Tap ▶ on the video once</b> (the phone needs that the first time), then use Listen again.'); break outer; }
          if (!res) break outer;
          await new Promise(z => setTimeout(z, 400));
        }
        await new Promise(z => setTimeout(z, 300));
      }
    } catch (e) { ytMsg('<span class="bad">' + esc(e.message) + '</span>'); }
    btn.disabled = false; btn.textContent = btn.dataset.label || '▶ Listen';
  }
  function listenNote(labels) {
    if (!Object.keys(Timings.data.lines).length) return '<p class="note small">Listening is not set up yet: Vijay still has to mark where each line starts in the recording. You can practise from the marks meanwhile.</p>';
    if (!Timings.runs(labels)) return '<p class="note small">Part of this isn’t in K. Suresh’s recording. Practise from the marks; ask Vijay if you are unsure.</p>';
    return '';
  }
  function listenButton(labels, text) {
    return `<button class="big" id="listen" data-label="${text}" ${Timings.runs(labels) ? '' : 'disabled'}>${text}</button>`;
  }
  const REASONS = {
    short: 'That was too short for what is on screen. Chant all of it, then tap Done.',
    noisy: 'There is too much background noise. Find a quieter spot and hold the phone 20–30 cm from your mouth.',
    unvoiced: 'I couldn’t hear your voice clearly. Chant a little louder and closer to the phone.',
    count: 'The number of syllables I heard doesn’t match. Check that you chanted all of it, and only this part.',
    segment: 'I couldn’t follow that one. Please try again.'
  };

  // Record a take of `lines`; onResult(analysis)
  function recorderUI(container, lines, onResult) {
    const multi = lines.length > 1;
    container.innerHTML = `<button class="rec big" id="recbtn">● Record${multi ? ' all of it' : ''}</button>
      <div id="recpanel" class="hidden"><div class="spread"><span><b class="bad">● Recording</b> <span class="muted small" id="rectime">0:00</span></span><span class="muted small">${multi ? 'Tap Done at the end' : 'Stops by itself after a pause'}</span></div>
      <div class="meter" style="margin:8px 0"><i id="lvl"></i></div>${multi ? '<p class="small muted">Take a short breath at the end of each line.</p>' : ''}<button class="primary big" id="donebtn">■ Done</button></div>
      <p id="recmsg" class="small"></p>`;
    const btn = container.querySelector('#recbtn'), panel = container.querySelector('#recpanel'), msg = container.querySelector('#recmsg');
    btn.onclick = async () => {
      if (recording || btn.disabled) return;
      btn.disabled = true;                       // no double taps while the permission prompt is up
      const my = ++takeToken;
      player.stop();
      const lb = $('#listen'); if (lb) lb.disabled = true;
      msg.textContent = '';
      const old = document.querySelector('#res'); if (old) old.innerHTML = '';
      let started = false, quiet = 0, finishing = false, timer = null;
      const silenceStop = multi ? 600 : 180; // frames of silence after speech (10 ms each)
      async function finish() {
        if (finishing || my !== takeToken) return; finishing = true;
        clearInterval(timer);
        recording = false;
        const frames = await rec.stop();
        try { wake && wake.release(); } catch (e) {}
        if (my !== takeToken) return;
        panel.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false;
        const lb2 = $('#listen'); if (lb2) lb2.disabled = !Timings.runs(lines.map(l => l.label));
        msg.textContent = multi ? 'Listening to your chant… (a long take can need a few seconds)' : 'Listening to your chant…';
        setTimeout(() => {
          if (my !== takeToken) return;
          let res;
          try { res = E.analyze(frames, lines, { target: target(), refPaces: lines.map(l => Timings.refPace(l)) }); }
          catch (e) { res = { ok: false, reason: 'segment', error: String(e) }; }
          msg.textContent = '';
          if (my === takeToken) onResult(res);
        }, 40);
      }
      try {
        recording = true;
        await rec.start((f, i, peak) => {
          if (my !== takeToken) return;
          const v = f.f0 > 0 && f.ap < 0.3 && f.rms > 0.004;
          if (v) { started = true; quiet = 0; } else if (started) quiet++;
          if (i % 4 === 0) { const el = $('#lvl'); if (el) el.style.width = Math.min(100, Math.round(peak * 220)) + '%'; }
          if (started && quiet > silenceStop) finish();
        });
      } catch (e) {
        recording = false; btn.disabled = false;
        const lb3 = $('#listen'); if (lb3) lb3.disabled = !Timings.runs(lines.map(l => l.label));
        msg.innerHTML = '<span class="bad">' + esc(e.name === 'NotAllowedError' ? 'Microphone permission was refused. In Settings → Safari → Microphone, allow this site, then reload.' : (e.message || String(e))) + '</span>';
        return;
      }
      if (my !== takeToken) { rec.stop(); return; }
      try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
      btn.classList.add('hidden'); panel.classList.remove('hidden');
      const t0 = Date.now();
      timer = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); const el = $('#rectime'); if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s > 1500) finish(); }, 500);
      container.querySelector('#donebtn').onclick = finish;
    };
  }
  function lineResultHTML(line, r, showStaff) {
    const pass = r.score >= target();
    return `<div class="${pass ? 'good' : 'badbox'}" style="margin:8px 0"><div class="spread"><b>${pass ? '✓ Well done' : 'Not yet'}</b><span class="small muted">score ${r.score} · pass mark ${target()}</span></div>
      <ul style="margin:6px 0 0 18px;padding:0">${r.comments.map(c => '<li>' + esc(c) + '</li>').join('')}</ul></div>
      ${showStaff ? '<div class="stafwrap">' + S.staff(line, r) + '</div><p class="muted small">Boxes show where each syllable should be (by its mark); dots show where your voice went — green right, red not yet.</p>' : ''}
      ${st.settings.teacher ? `<p class="small muted">svara ${(r.svaraAcc * 100).toFixed(0)}% · timing ${r.timing} ${r.timingNotes.join(',')} · ${r.pace.toFixed(2)} s/mātrā · spread ${r.spread.toFixed(1)} st</p>` : ''}`;
  }
  const dots = a => '<span class="dots">' + a.slice(-3).map(s => `<i class="${s >= target() ? 'p' : 'f'}"></i>`).join('') + '</span>';
  // pass check for multi-line takes; lines marked "learnt by ear" are left out
  function takePass(res, passMark) {
    const rs = res.lines.filter(r => !isEar(r.label));
    if (!rs.length) return { pass: true, score: res.score };
    const n = rs.reduce((a, r) => a + r.per.length, 0);
    const score = Math.round(rs.reduce((a, r) => a + r.score * r.per.length, 0) / n);
    return { pass: score >= passMark && rs.every(r => r.score >= passMark - 15 || (st.lines[r.label] || {}).flag), score };
  }

  // ---------------- views ----------------
  function home() {
    leave(); showPlayer(false); head.innerHTML = '';
    if (st.sittingDay !== today()) { st.sittingDay = today(); st.warmupDue = st.done.length > 0; save(); } // warm-up once, at the start of a day's sitting
    const n = nextStep();
    const learned = st.done.length, total = C.groups.length;
    const exportDue = st.done.length && Date.now() - (st.lastExport || 0) > 3 * 86400e3;
    let secs = '';
    C.sections.forEach(s => {
      const d = s.groups.filter(groupDone).length;
      secs += `<li><details><summary class="spread" style="cursor:pointer"><span><span class="chev">›</span> ${esc(s.title)}</span><span class="small muted">${d}/${s.groups.length}${sectionDone(s) ? ' <span class="tick">✓</span>' : ''}</span></summary>
        <ul class="clean small">${s.groups.map(g => `<li class="spread"><span>${groupDone(g) ? '<span class="tick">✓</span> ' : ''}${esc(g.title)}</span><button class="chip" data-open="${g.id}">${groupDone(g) ? 'Practise' : 'Open'}</button></li>`).join('')}
        ${s.groups.length >= 2 ? `<li class="spread"><span>Whole ${esc(s.title)}</span><button class="chip" data-test="${s.id}">Chant all</button></li>` : ''}</ul></details></li>`;
    });
    app.innerHTML = `<h1>Sri Rudram</h1><p class="muted">Chant practice with K. Suresh</p>
      ${!storageOK ? '<p class="badbox small">This browser is not saving progress (private browsing?). Use normal Safari.</p>' : ''}
      ${exportDue ? '<p class="note small">Progress is kept on this phone only. Tap “End sitting” to send it to Vijay as a backup.</p>' : ''}
      <div class="card"><div class="muted small">Next</div><h2 style="margin:4px 0 10px">${esc(stepTitle(n))}</h2>
        <button class="primary big" id="go">Start</button></div>
      <div class="card"><div class="spread"><b>Progress</b><span class="small muted">${learned} of ${total} mantras</span></div><div class="bar" style="margin:8px 0"><i style="width:${(learned / total * 100).toFixed(1)}%"></i></div>
        <ul class="clean">${secs}</ul></div>
      <div class="row"><button id="end">End sitting &amp; send progress</button><button id="settings">Settings</button><button id="help">Help</button></div>`;
    $('#go').onclick = () => runStep(n);
    $('#end').onclick = endSitting; $('#settings').onclick = settings; $('#help').onclick = help;
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => learn(b.dataset.open, groupDone(C.groupById[b.dataset.open]) ? 0 : undefined));
    app.querySelectorAll('[data-test]').forEach(b => b.onclick = () => sectionTake(b.dataset.test, false));
  }
  function runStep(n) {
    if (n.kind === 'warmup') return warmup();
    if (n.kind === 'review') return reviewTake(n.groups);
    if (n.kind === 'test') return sectionTake(n.section, true);
    if (n.kind === 'learn') return learn(n.group);
    if (n.kind === 'final') return finalTake(n.part);
    home();
  }
  function setHead(kicker, title, extra) {
    head.innerHTML = `<button class="link" id="back">‹ Home</button><div class="label">${esc(kicker)}</div><h1>${esc(title)}</h1>${extra || ''}`;
    $('#back').onclick = home;
  }

  // ----- learn one mantra group: each line, then whole, then meaning
  function learn(gid, startStep) {
    const g = C.groupById[gid], sec = C.sectionById[g.section];
    const lines = g.lines;
    let step = startStep != null ? startStep : Math.max(0, lines.findIndex(l => !linePassed(l)));
    if (startStep == null && lines.every(linePassed)) step = G(gid).whole ? lines.length + 1 : lines.length;
    const nSteps = lines.length + 2;
    const stepsBar = () => '<div class="steps">' + Array.from({ length: nSteps }, (_, i) => `<span class="${i < step ? 'done' : i === step ? 'cur' : ''}"></span>`).join('') + '</div>';
    function render() {
      leave();
      setHead(sec.title, g.title, stepsBar());
      if (step < lines.length) return renderLine(lines[step]);
      if (step === lines.length) return renderWhole();
      return renderMeaning();
    }
    function renderLine(line) {
      showPlayer(true);
      const s = L(line.label);
      let visitFails = 0;
      app.innerHTML = `
        <div class="card"><div class="spread"><span class="label">${esc(line.label)}</span>${dots(s.a)}</div>
          <div class="deva">${esc(line.deva)}</div><div class="iast">${esc(line.iast)}</div>
          <details class="small" style="margin-top:6px"><summary class="muted"><span class="chev">›</span> Meaning and key words</summary><p>${esc(g.meaning)}</p><p class="muted">${g.keywords.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</p>${g.notes.map(n => '<p class="note">' + esc(n) + '</p>').join('')}</details></div>
        ${listenNote([line.label])}
        <div class="row">${speedChips()}</div>
        <div class="row" style="margin:10px 0">${listenButton([line.label], '▶ Listen')}</div>
        <p class="small muted">Listen ${st.settings.listens === 1 ? 'once' : st.settings.listens + ' times'}, then chant the line back.</p>
        <div id="rec"></div><div id="res"></div>
        <div class="navbar row" id="nav"></div>`;
      bindSpeed();
      const lb = $('#listen'); lb.onclick = () => listen([line.label], st.settings.listens, lb);
      const nav = () => {
        const passed = linePassed(line);
        $('#nav').innerHTML = (passed ? `<button class="primary big" id="next">Next ›</button>` : '') +
          (!passed && visitFails >= 5 ? `<button class="big" id="skip">Move on — we’ll come back to this line</button>` : '') +
          (st.settings.teacher && !passed ? `<button id="ear">Teacher: learnt by ear</button>` : '');
        const nx = $('#next'); if (nx) nx.onclick = () => { step++; render(); };
        const sk = $('#skip'); if (sk) sk.onclick = () => { s.flag = true; s.passed = true; s.provisional = true; save(); step++; render(); };
        const ea = $('#ear'); if (ea) ea.onclick = () => { s.ear = true; s.flag = false; save(); nav(); };
      };
      nav();
      recorderUI($('#rec'), [line], res => {
        const box = $('#res');
        if (!res.ok) { box.innerHTML = '<p class="note">' + esc(REASONS[res.reason] || REASONS.segment) + '</p>'; return; }
        const r = res.lines[0];
        s.a.push(r.score); s.a = s.a.slice(-10);
        const last3 = s.a.slice(-3), passes = last3.filter(x => x >= target()).length;
        if (passes >= 2) { s.passed = true; s.flag = false; s.provisional = false; }
        if (r.score < target()) visitFails++;
        save();
        box.innerHTML = lineResultHTML(line, r, true) + (linePassed(line) && !s.provisional ? '<p class="ok"><b>Line learned.</b></p>' : `<p class="small muted">Pass on 2 of your last 3 tries. ${passes ? 'One more good one!' : ''}</p>`);
        const dd = document.querySelector('.card .dots'); if (dd) dd.outerHTML = dots(s.a);
        nav();
      });
    }
    function renderWhole() {
      const labels = lines.map(l => l.label);
      if (lines.length === 1) { G(gid).whole = true; save(); step++; return render(); }
      showPlayer(true);
      app.innerHTML = `<div class="card"><b>Now the whole mantra</b><p class="small muted">Chant all ${lines.length} lines in one go.</p>
        ${lines.map(l => `<div><span class="label">${esc(l.label)}</span><div class="deva sm">${esc(l.deva)}</div></div>`).join('')}</div>
        ${listenNote(labels)}<div class="row">${speedChips()}</div>
        <div class="row" style="margin:10px 0">${listenButton(labels, '▶ Listen')}</div>
        <div id="rec"></div><div id="res"></div><div class="navbar row" id="nav"></div>`;
      bindSpeed();
      const lb = $('#listen'); lb.onclick = () => listen(labels, 1, lb);
      recorderUI($('#rec'), lines, res => {
        const box = $('#res');
        if (!res.ok) { box.innerHTML = '<p class="note">' + esc(REASONS[res.reason] || REASONS.segment) + '</p>'; return; }
        const tp = takePass(res, target());
        box.innerHTML = `<div class="${tp.pass ? 'good' : 'badbox'}"><b>${tp.pass ? '✓ The whole mantra is good' : 'Not yet — see the lines below'}</b> <span class="small muted">score ${tp.score}</span></div>` +
          res.lines.map((r, i) => `<details ${r.score < target() ? 'open' : ''}><summary>${esc(r.label)} — ${r.score} ${r.score >= target() ? '<span class="tick">✓</span>' : ''}${isEar(r.label) ? ' <span class="muted">(by ear)</span>' : ''}</summary>${lineResultHTML(lines[i], r, true)}</details>`).join('');
        if (tp.pass) { G(gid).whole = true; save(); $('#nav').innerHTML = '<button class="primary big" id="next">Next: the meaning ›</button>'; $('#next').onclick = () => { step++; render(); }; }
      });
    }
    function renderMeaning() {
      showPlayer(false);
      app.innerHTML = `<div class="card"><b>Meaning</b><p>${esc(g.meaning)}</p><p class="muted small">${g.keywords.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</p></div>
        <div class="card"><p>Now open your Guru in the ChatGPT app and say:</p><p><b>“Meaning of ${esc(g.title.replace('Lines ', 'lines '))}”</b></p><p class="small muted">Tell it the meaning in your own words; it will help you fill any gaps.</p></div>
        <div class="navbar"><button class="primary big" id="fin">Done — mantra learned ✓</button></div>`;
      $('#fin').onclick = () => {
        const gg = G(gid); gg.meaning = true;
        if (!gg.done) { gg.done = true; gg.doneAt = Date.now(); if (!st.done.includes(gid)) st.done.push(gid); }
        save(); home();
      };
    }
    render();
  }

  // ----- a multi-line take (warm-up, review, section test, final)
  function take(opts) {
    leave();
    const lines = opts.lines, labels = lines.map(l => l.label);
    setHead(opts.kicker, opts.title, `<p class="muted">${esc(opts.intro)}</p>`);
    showPlayer(true);
    app.innerHTML = `<div class="card" style="max-height:46vh;overflow:auto">${lines.map(l => `<div><span class="label">${esc(l.label)}</span>${isEar(l.label) ? ' <span class="small muted">by ear</span>' : ''}<div class="deva sm">${esc(l.deva)}</div></div>`).join('')}</div>
      ${listenNote(labels)}<div class="row">${speedChips()}</div>
      <div class="row" style="margin:10px 0">${listenButton(labels, '▶ Listen to all')}</div>
      <div id="rec"></div><div id="res"></div><div class="navbar row" id="nav">${opts.optional ? '<button class="big" id="skipto">Skip for today</button>' : ''}</div>`;
    bindSpeed();
    const sk = $('#skipto'); if (sk) sk.onclick = () => { opts.onDone(false, null); };
    const lb = $('#listen'); lb.onclick = () => listen(labels, 1, lb);
    recorderUI($('#rec'), lines, res => {
      const box = $('#res');
      if (!res.ok) { box.innerHTML = '<p class="note">' + esc(REASONS[res.reason] || REASONS.segment) + '</p>'; return; }
      const tp = takePass(res, opts.passMark);
      res.lines.forEach(r => { const s = L(r.label); if (r.score < target() - 15) s.flag = true; else if (r.score >= target()) s.flag = false; });
      save();
      box.innerHTML = `<div class="${tp.pass ? 'good' : 'badbox'}"><b>${tp.pass ? '✓ ' + opts.passText : 'Not yet — practise the red lines and try again'}</b> <span class="small muted">score ${tp.score} · pass ${opts.passMark}</span></div>` +
        res.lines.map((r, i) => `<details ${r.score < opts.passMark && !isEar(r.label) ? 'open' : ''}><summary>${esc(r.label)} — ${r.score} ${r.score >= opts.passMark ? '<span class="tick">✓</span>' : isEar(r.label) ? '<span class="muted">(by ear)</span>' : '<span class="bad">●</span>'}</summary>${lineResultHTML(lines[i], r, true)}</details>`).join('');
      const label = opts.contLabel ? opts.contLabel(tp.pass) : (tp.pass ? 'Continue ›' : 'Back home');
      $('#nav').innerHTML = `<button class="primary big" id="cont">${label}</button>${!tp.pass && opts.optional ? '<button class="big" id="skipto2">Skip for today</button>' : ''}`;
      $('#cont').onclick = () => opts.onDone(tp.pass, res);
      const s2 = $('#skipto2'); if (s2) s2.onclick = () => opts.onDone(false, null);
    });
  }
  function warmup() {
    const last = st.done.slice(-2).map(id => C.groupById[id]).filter(Boolean);
    const flagged = Object.keys(st.lines).filter(k => st.lines[k].flag && C.byLabel[k]).slice(0, 3).map(k => C.byLabel[k]);
    const set = []; last.forEach(g => g.lines.forEach(l => set.push(l))); flagged.forEach(l => { if (!set.includes(l)) set.push(l); });
    set.sort((a, b) => C.lines.indexOf(a) - C.lines.indexOf(b));
    take({ lines: set, kicker: 'Warm-up', title: 'Chant what you learned last time', intro: 'Listen if you like, then chant these lines in one go.', passMark: target() - 5, optional: true, passText: 'Good warm-up',
      contLabel: () => 'Continue ›', onDone: () => { st.warmupDue = false; save(); home(); } });
  }
  function reviewTake(gids) {
    const lines = gids.flatMap(id => C.groupById[id].lines);
    take({ lines, kicker: 'Review', title: 'Your last 5 mantras together', intro: 'Chant them all in one go, as you would in a recital.', passMark: target() - 5, passText: 'Review passed',
      onDone: pass => { if (pass) { st.reviewAt = Math.min(st.done.length, st.reviewAt + 5); save(); } home(); } });
  }
  function sectionTake(sid, isTest) {
    const s = C.sectionById[sid];
    const lines = s.groups.flatMap(g => g.lines);
    take({ lines, kicker: isTest ? 'Test' : 'Practice', title: 'The whole of ' + s.title, intro: 'Chant the whole section in one go. Tap Done at the end.', passMark: target() - 5, passText: s.title + ' passed',
      onDone: pass => { if (pass) { st.sections[sid] = { test: true, at: Date.now() }; save(); } home(); } });
  }
  function finalTake(part) {
    const secs = C.sections.filter(s => part === 'all' ? true : s.part === part);
    let i = 0; const scores = [];
    const nextSec = () => {
      if (i >= secs.length) {
        leave(); showPlayer(false); head.innerHTML = '';
        const pass = scores.every(Boolean);
        if (pass) { st.parts[part] = { final: true, at: Date.now() }; save(); }
        app.innerHTML = `<h1>${pass ? 'Wonderful!' : 'Nearly there'}</h1><p>${pass ? 'You chanted the whole ' + (part === 'all' ? 'Sri Rudram' : part === 1 ? 'Namakam' : 'Chamakam') + '.' : 'Some sections need more practice. Use “Chant all” on those sections, then try the final again.'}</p><button class="primary big" id="h">Home</button>`;
        $('#h').onclick = home; return;
      }
      const s = secs[i];
      take({ lines: s.groups.flatMap(g => g.lines), kicker: `Final · section ${i + 1} of ${secs.length}`, title: s.title, intro: 'Chant this section, tap Done, then go on to the next.', passMark: target() - 5, passText: s.title + ' — good',
        contLabel: () => i + 1 < secs.length ? 'Next section ›' : 'Finish ›', onDone: pass => { scores.push(pass); i++; nextSec(); } });
    };
    nextSec();
  }

  // ----- end sitting / backup
  function progressCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(st)))); }
  function summaryText() {
    const n = nextStep(); const fl = Object.keys(st.lines).filter(k => st.lines[k].flag);
    const lastG = st.done.length ? C.groupById[st.done[st.done.length - 1]] : null;
    return `Anu — Sri Rudram progress, ${today()}\nMantras learned: ${st.done.length} of ${C.groups.length}${lastG ? ' (last: ' + lastG.title + ')' : ''}\nNext: ${stepTitle(n)}\n${fl.length ? 'Lines to revisit: ' + fl.join(', ') + '\n' : ''}Backup code:\n${progressCode()}`;
  }
  async function endSitting() {
    const text = summaryText();
    if (navigator.share) { try { await navigator.share({ title: 'Rudram progress', text }); st.lastExport = Date.now(); save(); return home(); } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text); st.lastExport = Date.now(); save(); alertBox('Progress copied. Paste it in a message to Vijay.'); } catch (e) { alertBox('Copy this and send it to Vijay:', text); }
  }
  function alertBox(msg, text) {
    leave(); showPlayer(false); head.innerHTML = '';
    app.innerHTML = `<button class="link" id="back">‹ Home</button><div class="card"><p>${esc(msg)}</p>${text ? '<textarea readonly id="tx">' + esc(text) + '</textarea><button id="cp">I have copied it</button>' : ''}</div>`; $('#back').onclick = home;
    const cp = $('#cp'); if (cp) cp.onclick = () => { st.lastExport = Date.now(); save(); home(); };
  }
  function settings() {
    leave(); showPlayer(false); head.innerHTML = '';
    const s = st.settings;
    app.innerHTML = `<button class="link" id="back">‹ Home</button><h1>Settings</h1>
      <div class="card"><div class="spread"><span>Listen before chanting</span><select id="ls">${[1, 2, 3].map(n => `<option ${s.listens === n ? 'selected' : ''} value="${n}">${n}×</option>`).join('')}</select></div></div>
      <div class="card"><b>Backup</b><p class="small muted">Progress is kept in this browser only. Copy the code to keep a backup, or paste a code to restore.</p>
        <div class="row"><button id="copy">Copy backup code</button><button id="restore">Restore from code</button></div><textarea id="code" class="hidden" placeholder="Paste a backup code here"></textarea></div>
      <div class="card"><label class="spread"><span>Teacher settings (for Vijay)</span><input type="checkbox" id="tm" ${s.teacher ? 'checked' : ''}></label>
        <div id="teacher" class="${s.teacher ? '' : 'hidden'}">
          <div class="spread" style="margin-top:10px"><span>Pass mark</span><input type="number" id="tg" min="50" max="95" value="${s.target}" style="width:80px"></div>
          <p class="small muted">Teacher mode also shows the raw numbers under each result and a “learnt by ear” button on lines.</p>
          <p><b>Line times</b> (from the tapping page): ${Object.keys(Timings.data.lines).length} lines set.</p>
          <textarea id="tim" placeholder="Paste exported line times here to try them before they are built in"></textarea>
          <div class="row"><button id="tsave">Use these times</button><button id="tclear">Clear override</button></div>
          <p style="margin-top:14px"><button id="reset" class="bad">Reset all progress</button></p></div></div>
      <p class="small muted">Text: sanskritdocuments.org (Rajagopal Iyer and Rekha Venkatesh), <a href="${COURSE.source_url}" target="_blank" rel="noopener">source</a>. Meanings written for this course. Chanting: the late K. Suresh, YouTube channel “The Ghanapati”, played through YouTube.</p>`;
    $('#back').onclick = home;
    $('#ls').onchange = e => { s.listens = +e.target.value; save(); };
    $('#tm').onchange = e => { s.teacher = e.target.checked; save(); $('#teacher').classList.toggle('hidden', !s.teacher); };
    const tg = $('#tg'); if (tg) tg.onchange = e => { s.target = Math.max(50, Math.min(95, +e.target.value || 75)); save(); };
    $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(progressCode()); $('#copy').textContent = 'Copied ✓'; st.lastExport = Date.now(); save(); } catch (e) { const t = $('#code'); t.classList.remove('hidden'); t.value = progressCode(); } };
    $('#restore').onclick = () => { const t = $('#code'); if (t.classList.contains('hidden')) { t.classList.remove('hidden'); t.value = ''; return; }
      try { const raw = t.value.trim().split(/\s+/).pop(); const o = JSON.parse(decodeURIComponent(escape(atob(raw)))); if (!o.v) throw 0; if (confirm('Replace the progress on this device with the code?')) { st = o; st.settings = Object.assign(fresh().settings, st.settings || {}); save(); home(); } } catch (e) { alert('That code could not be read.'); } };
    $('#tsave').onclick = () => { try { const o = JSON.parse($('#tim').value); if (!o.lines) throw 0; localStorage.setItem('anuRudram.timingsOverride', JSON.stringify(o)); Timings.load(); alert('Line times loaded: ' + Object.keys(o.lines).length); } catch (e) { alert('Not a line-times export.'); } };
    $('#tclear').onclick = () => { localStorage.removeItem('anuRudram.timingsOverride'); Timings.load(); alert('Override cleared.'); };
    $('#reset').onclick = () => { if (confirm('Erase all progress on this device?') && confirm('Really erase? This cannot be undone.')) { st = fresh(); save(); home(); } };
  }
  function help() {
    leave(); showPlayer(false); head.innerHTML = '';
    app.innerHTML = `<button class="link" id="back">‹ Home</button><h1>How this works</h1>
      <div class="card"><ol style="padding-left:20px;margin:0">
        <li>Each mantra is learned line by line. Tap <b>Listen</b> to hear K. Suresh chant the line (slow it down with 0.75× or 0.5×). The first time, you may need to tap ▶ on the video itself once.</li>
        <li>Tap <b>Record</b> and chant the line back. The app listens to the pitch of each syllable and checks it against the marks: a line <b>below</b> = low, a line <b>above</b> = higher, no mark = your middle note.</li>
        <li>A line is learned when you pass on 2 of your last 3 tries. Then you chant the whole mantra, then say its meaning to your Guru in the ChatGPT app.</li>
        <li>After every 5 mantras you chant them together. At the end of each anuvāka you chant the whole anuvāka. At the end, the whole Namakam, Chamakam and Sri Rudram.</li></ol></div>
      <div class="card"><b>Tips</b><ul style="padding-left:20px;margin:6px 0"><li>A quiet room; phone 20–30 cm from your mouth.</li><li>Your own middle note is fine — the app follows your voice.</li><li>The app checks the rise and fall of your voice and your pace. It does not check the words: your Guru does that.</li><li>Sittings of about 15 minutes work best.</li></ul></div>
      <div class="card"><b>Privacy</b><p class="small">Your voice is analysed on this phone and never uploaded or stored. The video comes from YouTube (privacy-enhanced mode), which receives the usual viewing information when it plays. Progress stays in this browser; “End sitting” sends Vijay a backup.</p></div>`;
    $('#back').onclick = home;
  }

  home();
})();

</script></body></html>
